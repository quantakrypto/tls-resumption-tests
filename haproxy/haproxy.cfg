# Two HTTPS frontends on one process, sharing one certificate and one TLS ticket key,
# differing only in whether a client certificate is required. The August 2026 series
# (commit 4a8f7622) isolates resumption per authentication policy; a stable release
# predating that series should let a ticket minted on the open frontend resume on the
# protected one.
global
    tune.ssl.default-dh-param 2048
    tune.ssl.lifetime 300
    ssl-default-bind-options ssl-min-ver TLSv1.3
defaults
    mode http
    timeout connect 5s
    timeout client 10s
    timeout server 10s

frontend open
    bind 127.0.0.1:8451 ssl crt bundle.pem ca-file ca.pem verify none
    http-request return status 200 content-type text/plain string "OPEN-FRONTEND\n"

frontend protected
    bind 127.0.0.1:8452 ssl crt bundle.pem ca-file ca.pem verify required
    http-request return status 200 content-type text/plain string "PROTECTED-FRONTEND\n"
