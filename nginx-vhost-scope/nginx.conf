# CVE-2025-23419 reproduction. Two server blocks, one certificate, one CA, one ticket key.
# They differ in exactly one directive: ssl_verify_client.
worker_processes 1;
daemon off;
error_log stderr info;
pid nginx.pid;
events { worker_connections 64; }
http {
  access_log off;
  ssl_session_cache shared:SSL:1m;
  ssl_session_tickets on;
  ssl_session_ticket_key ticket.key;      # SHARED, so a ticket minted by one is decryptable by the other
  ssl_session_timeout 10m;
  ssl_protocols TLSv1.3;

  server {                                 # the OPEN host: no client certificate requested
    listen 8443 ssl;
    server_name open.test;
    ssl_certificate     server.pem;
    ssl_certificate_key server.key;
    ssl_client_certificate ca.pem;
    ssl_verify_client off;
    location / { return 200 "OPEN-HOST-CONTENT\n"; }
  }

  server {                                 # the PROTECTED host: client certificate REQUIRED
    listen 8443 ssl;
    server_name protected.test;
    ssl_certificate     server.pem;
    ssl_certificate_key server.key;
    ssl_client_certificate ca.pem;
    ssl_verify_client on;
    location / { return 200 "PROTECTED-HOST-CONTENT\n"; }
  }
}
